name: Documentation issue
description: Report missing, unclear, outdated, or incorrect documentation.
title: "[Docs]: "
labels: ["documentation", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Documentation bugs are real bugs — thanks for reporting one. If you already
        know what the text should say, a pull request is usually faster than an issue.

  - type: input
    id: location
    attributes:
      label: Location
      description: Link to the page, or the path and heading of the file in this repository.
      placeholder: "README.md § Quick start, docs/..., or a docs.nvidia.com URL"
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Kind of issue
      options:
        - Incorrect or outdated information
        - Missing information
        - Unclear or confusing wording
        - Example or snippet does not work
        - Broken link, formatting, or rendering
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong?
      description: >
        Quote the passage if that helps, and explain what is misleading, missing, or
        out of date. If an example does not work, paste the command you ran and the
        error you got.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
      description: What the documentation should say instead. A rough draft is fine.
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'm willing to open a PR to fix this.
          required: false
