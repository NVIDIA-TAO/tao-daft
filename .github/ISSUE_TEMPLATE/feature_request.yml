name: Feature request
description: Propose a new capability or an enhancement to an existing one.
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the **problem** first. Understanding the use case lets
        maintainers evaluate solutions you may not have considered.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I searched open and closed issues, and this is not a duplicate.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: >
        What are you trying to do, and what is blocking or painful today?
        Describe the need, not just the solution.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you would like this project to do. Include a sketch of the API, CLI, or config if applicable.
    validations:
      required: true

  - type: input
    id: component
    attributes:
      label: Component / area
      description: The subcommand, module, model, or service this affects.
      placeholder: "e.g. CLI, validator, converter, docs"
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you evaluated, and why they fall short.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Prior art in other projects, links to specs, related issues or PRs.
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I understand contributions require a DCO sign-off (see `CONTRIBUTING.md`).
          required: true
        - label: I'm willing to open a PR to implement this.
          required: false
