blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability
    url: https://www.nvidia.com/object/submit-security-vulnerability.html
    about: >-
      Do not file security issues on GitHub. Report them privately to NVIDIA PSIRT
      (or email psirt@nvidia.com). See SECURITY.md for details.
  - name: Ask a usage question
    url: https://forums.developer.nvidia.com/c/accelerated-computing/intelligent-video-analytics/tao-toolkit/
    about: >-
      "How do I ...?" questions are answered on the NVIDIA TAO developer forum.
      The issue tracker is for bugs and feature requests.
  - name: NVIDIA TAO documentation
    url: https://docs.nvidia.com/tao/
    about: Product documentation, tutorials, and API references.
