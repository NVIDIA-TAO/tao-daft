name: Bug report
description: Report incorrect, unexpected, or broken behavior.
title: "[Bug]: "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report.

        Before you start, please search the open **and closed** issues. If someone
        already reported this, add a 👍 and any new detail to that issue instead of
        opening a new one — it gets fixed faster that way.

        You do not need to open an issue if you already have a fix ready — open a
        pull request directly and describe the bug there.

        Note that reporting a bug does not guarantee it will be fixed, and
        maintainers cannot commit to timelines or ETAs. The fastest path to a fix is
        a clear reproduction, or a pull request.

        **🔒 Do not report security vulnerabilities here.** Security issues must be
        reported privately to NVIDIA PSIRT — see `SECURITY.md`, or
        https://www.nvidia.com/object/submit-security-vulnerability.html. If a
        vulnerability is filed publicly here, maintainers may limit discussion and
        redirect you to the private channel.

        **⚠️ Redact before you paste.** Logs, configs, and environment dumps often
        contain API tokens, keys, passwords, internal hostnames, dataset paths, or
        customer data. Replace them with placeholders such as `<REDACTED>`.

        For "how do I ...?" questions, please use the developer forum linked on the
        issue chooser — the tracker is for bugs and feature requests.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I searched open and closed issues and this is not a duplicate.
          required: true
        - label: I reproduced this on the latest released version, or on `main`.
          required: true
        - label: I checked the documentation and this behavior contradicts it (or is undocumented).
          required: false

  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag, installed package version, or commit SHA you are running.
      placeholder: "7.0.0, or commit abc1234"
    validations:
      required: true

  - type: input
    id: component
    attributes:
      label: Component / area
      description: The subcommand, module, model, or service where the problem occurs.
      placeholder: "e.g. CLI, validator, converter, docs, CI"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: >
        A clear and concise description of the bug: what you observed, and what you
        expected to happen instead. Screenshots are welcome.
      placeholder: |
        I ran ..., and expected A to happen. Instead, B happened.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: >
        The exact commands, config, and smallest possible input that trigger this.
        Maintainers will copy-paste this and expect the same result, so please trim
        anything irrelevant, avoid private data, and include the imports or file
        layout needed to run it. If it is too long to inline, link a public gist or
        repository.


        **Reports without a reproduction usually cannot be acted on and may be closed.**
      placeholder: |
        1. Install with: ...
        2. Run: <command>
        3. With this input / config:
           ...
        4. Observe: ...
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / full traceback
      description: >
        The complete error output, not just the last line. Enable verbose or debug
        logging if the project supports it. Long output is fine — paste it all, or
        attach it as a file.
      render: shell
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >
        Fill in what applies and paste any command output. Remove anything sensitive
        first. If you are using an official NVIDIA container image, the image tag is
        usually enough — you can skip the driver and library versions.
      value: |
        <details>
        <summary>Environment details</summary>

        ```text
        Environment location: bare-metal / Docker / Kubernetes / cloud (which provider?)
        Install method:       container / pip / from source  — give the exact commands used
        If container:         the image tag, plus the `docker pull` and `docker run` commands

        OS version:
        Python version:
        Package version:

        # Useful commands:
        #   python -c "import platform, sys; print(platform.platform()); print(sys.version)"
        #   pip list | grep -i nvidia

        GPU model / driver / CUDA / cuDNN / TensorRT   (if GPU-related — `nvidia-smi`):

        # If deployed on Kubernetes, also attach:
        #   kubectl get pods -A
        #   kubectl get services
        #   helm list -A
        #   kubectl describe pod <pod> / kubectl logs <pod>   for the failing pod

        <paste output here>
        ```

        </details>
    validations:
      required: true

  - type: input
    id: regression
    attributes:
      label: Last known working version
      description: >
        If this used to work, the last version where it did. Narrowing it to a single
        release — or a single commit — is the single most useful thing you can add.
      placeholder: "e.g. worked in 6.0.0, broke in 7.0.0 — or 'never worked'"
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: >
        Workarounds you found, whether it reproduces on other platforms or hardware,
        and links to related issues or PRs. Also useful: any spec or config values
        you overrode, whether you are running multi-GPU or multi-node, and the
        notebook, model, or dataset involved.
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Are you willing to submit a PR?
      description: >
        Absolutely not required — but if you already understand the fix, maintainers
        are happy to guide you through the contribution process. New contributors
        are welcome.
      options:
        - label: Yes, I'm willing to submit a PR to fix this.
          required: false
